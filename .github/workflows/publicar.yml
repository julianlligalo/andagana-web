# Se ejecuta cada vez que se guarda algo (desde el panel o con git push):
# 1. reduce y comprime las fotos nuevas
# 2. revisa las propiedades y genera data/propiedades.js y el feed RSS (feed.xml)
# 3. guarda esos cambios en el repositorio
# 4. avisa los errores (resumen + aviso en "Issues")
# 5. publica la página en GitHub Pages
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Reducir y comprimir fotos
        run: bash scripts/optimizar-fotos.sh

      - name: Revisar propiedades y generar datos
        id: datos
        shell: pwsh
        run: ./scripts/construir-datos.ps1

      - name: Guardar cambios generados
        run: |
          git config user.name "andagana-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img data/propiedades.js data/propiedades REVISION-PROPIEDADES.md feed.xml
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Fotos optimizadas y datos actualizados [automático]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi

      - name: Avisar errores en Issues
        env:
          GH_TOKEN: ${{ github.token }}
          AVISOS: ${{ steps.datos.outputs.avisos }}
        run: |
          titulo="⚠️ Revisar propiedades"
          numero=$(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[0].number // empty')
          if [ "${AVISOS:-0}" != "0" ]; then
            if [ -n "$numero" ]; then
              gh issue edit "$numero" --body-file REVISION-PROPIEDADES.md
            else
              gh issue create --title "$titulo" --body-file REVISION-PROPIEDADES.md
            fi
          elif [ -n "$numero" ]; then
            gh issue close "$numero" --comment "✅ Todos los errores fueron corregidos."
          fi

      - name: Preparar archivos de la página
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' \
            --exclude '.pages.yml' --exclude '*.md' --exclude 'servidor.ps1' --exclude '.claude' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
